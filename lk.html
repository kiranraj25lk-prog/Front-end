<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        div{
            border-bottom:1px solid red;
            padding:10px;
        }
        </style>
    <script>
        var num = prompt("please enter the number","");
        for(i=0;i<=10;i++){
            document.write("<div>");
             document.write(i + " × " + num + " = " + (i * num));
            document.write("</div>");
        }
    </script>
</head>
<body>
    
</body>
</html>
