```html
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Star Pattern</title>
</head>
<body>
    <script>
        var rows = Number(prompt("Please enter the number of rows:"));

        function printPattren(rows) {
            
            for (var i = 1; i <= rows; i++) {
                for (var j = 1; j <= i; j++) {
                    document.write("*");
                }
                document.write("<br>");
            }

            
            for (var i = rows - 1; i >= 1; i--) {
                for (var j = 1; j <= i; j++) {
                    document.write("*");
                }
                document.write("<br>");
            }
        }

        printPattren(rows);
    </script>
</body>
</html>
